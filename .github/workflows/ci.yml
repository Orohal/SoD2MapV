name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build app/SoD2MapViewer.csproj -c Release --nologo

      - name: SelfTest (19 Checks)
        run: dotnet run --project tests/SoD2MapViewer.SelfTest/SelfTest.csproj -c Release --no-launch-profile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoD2MapV-ci
          path: app/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 7
